name = "chalupa-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set this to your production frontend domain (used for CORS allow-list).
# Cloudflare Pages *.pages.dev previews are always allowed automatically.
# For a custom domain, set the exact origin here, e.g. "https://thedamai.com"
FRONTEND_URL = "https://thedamai.com"

# Secrets (never commit plaintext values):
# Set via CLI:  wrangler secret put RESEND_API_KEY
#               wrangler secret put JWT_SECRET
# For local dev: create backend/.dev.vars and add them there (git-ignored)

[[d1_databases]]
binding = "DB"
database_name = "chalupa-db"
database_id = "4b70277d-53fe-4283-82a3-faa9de2cb0fe"

[triggers]
crons = ["*/20 * * * *"]
